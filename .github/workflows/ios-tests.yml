name: iOS Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:         # adds a manual "Run workflow" button in the Actions tab

# Cancel an in-flight run when a newer commit is pushed to the same ref.
concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Reuse compiled output between runs so the build step mostly skips recompiling.
      # The key rolls over when sources or the project file change; restore-keys lets a
      # changed run start from the most recent prior cache and rebuild incrementally.
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: DerivedData
          key: deriveddata-${{ runner.os }}-${{ hashFiles('**/*.swift', '**/project.pbxproj') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-

      # This project uses pbxproj objectVersion 90 and Swift settings that require
      # Xcode >= 26. Select the newest Xcode installed on the runner, then fail
      # early with a clear message if it is still too old.
      - name: Select newest Xcode
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          MAJOR="$(xcodebuild -version | awk 'NR==1 {print $2}' | cut -d. -f1)"
          if [ "$MAJOR" -lt 26 ]; then
            echo "::error::This project needs Xcode >= 26, but the runner's newest is Xcode $MAJOR. Use a newer runner image (e.g. macos-26) or install Xcode 26+."
            exit 1
          fi

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project CoreML-Sounds.xcodeproj \
            -scheme CoreML-Sounds \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()           # keep the .xcresult even when tests fail
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
